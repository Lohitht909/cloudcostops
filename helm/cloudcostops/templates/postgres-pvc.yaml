apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: {{ .Release.Name }}-postgres-pvc
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: {{ .Values.postgres.storage.storageClass }}

  resources:
    requests:
      storage: {{ .Values.postgres.storage.size }}