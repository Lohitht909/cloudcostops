apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcostops-postgres
  namespace: cloudcostops
  labels:
    app: cloudcostops-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloudcostops-postgres

  template:
    metadata:
      labels:
        app: cloudcostops-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cloudcostops-postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cloudcostops-postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudcostops-postgres-secret
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cloudcostops
                - -d
                - cloudcostops
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - cloudcostops
                - -d
                - cloudcostops
            initialDelaySeconds: 30
            periodSeconds: 20

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: cloudcostops-postgres-pvc