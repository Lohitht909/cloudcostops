name: CloudCostOps CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend/app
      - name: Run backend tests when present
        working-directory: backend
        shell: bash
        run: |
          pytest -q
          result=$?
          if [ "$result" -eq 5 ]; then
            echo "No tests discovered yet; Python compilation passed."
            exit 0
          fi
          exit "$result"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -t cloudcostops-frontend:ci ./frontend
      - name: Build backend image
        run: docker build -t cloudcostops-backend:ci ./backend
